<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; form-action 'none'"><title>CIMA — Serveur</title><link rel="stylesheet" href="desktop.css"></head>
<body><main class="panel"><div class="heading"><img src="../assets/cima.png" alt="" width="40" height="40"><div><h1>Connexion au serveur</h1><p>Choisissez l’application utilisée par ce poste.</p></div></div>
<form id="connection-form"><label for="server-url">Adresse de CIMA</label><input id="server-url" type="url" required autocomplete="url" placeholder="https://cliniquecima.up.railway.app"><p class="hint">Pour le réseau local, utilisez l’adresse affichée dans Paramètres → Réseau local sur le serveur.</p><p id="connection-error" class="error" role="alert" hidden></p><div class="actions"><button id="default-server" class="secondary" type="button">CIMA en ligne</button><button id="save-server" type="submit">Enregistrer et ouvrir</button></div></form>
<p class="footnote">Les données restent sur le serveur choisi. Vos identifiants ne sont pas copiés vers un autre serveur.</p></main><script src="settings.js"></script></body></html>
